<style>
:root{--navy:#12213f;--navy2:#1d3c73;--blue:#2864dc;--blue2:#194bb2;--green:#0f8a67;--red:#d64545;--gray:#f4f7fb;--gray2:#e8eef8;--line:#dde5f0;--ink:#17233a;--soft:#64748b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:linear-gradient(135deg,#f7f9fd,#eef3fb);color:var(--ink);font-family:'Noto Sans Bengali','Inter',sans-serif;overscroll-behavior-y:none}
.num{font-family:'Inter','Noto Sans Bengali';font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Baloo Da 2','Noto Sans Bengali';margin:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#app.hidden{display:none}
@media(min-width:900px){#app{max-width:1180px}}
header.top{background:radial-gradient(circle at 88% -20%,rgba(92,155,255,.48),transparent 40%),linear-gradient(135deg,#112343,#1c4c91);color:#fff;padding:18px;position:sticky;top:0;z-index:20;border-bottom-left-radius:22px;border-bottom-right-radius:22px;box-shadow:0 10px 28px rgba(18,33,63,.2)}
header.top .brand{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.brand-title{font-size:22px;font-weight:800;line-height:1.15;display:flex;align-items:center}
.brand-sub{font-size:11.5px;opacity:.78;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{width:40px;height:40px;border:0;border-radius:11px;background:rgba(255,255,255,.14);color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hrow{display:flex;gap:6px}
.project-bar{background:linear-gradient(90deg,#dceaff,#edf5ff);border-bottom:1px solid #cbdcf5;padding:8px 12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:14px -18px -22px}
.project-bar::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;color:#46617f;background:rgba(255,255,255,.72);border:1px solid #d1e0f4;cursor:pointer}
.ptab.active{color:#fff;background:linear-gradient(135deg,#3978ed,#2054bc);border-color:#3978ed}
.ptab.add{color:#2864dc;font-size:15px;padding:2px 12px 4px}
nav.topnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;position:sticky;top:0;z-index:19;margin:22px -18px 0}
nav.topnav::-webkit-scrollbar{display:none}
.navbtn{flex:1 0 auto;min-height:46px;border-radius:11px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:800;cursor:pointer;border:1px solid #dbe6f5;background:#f8fbff;color:#435b7d}
.navbtn.active{color:var(--blue);background:#eaf1ff;border-color:#c8daf7}
.navbtn.dep{background:#e7f7f0;border-color:#ccefe2;color:#087554}
.navbtn.exp{background:#fff0ee;border-color:#ffd9d4;color:#c43e45}
.navbtn .ic{font-size:17px}
main{flex:1;padding:17px 14px 100px}
@media(min-width:900px){main{padding:24px 32px 70px}}
.card{background:#fff;border:1px solid #e3eaf4;border-radius:var(--r);padding:15px 16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(26,52,94,.05)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:900px){.stat-grid{grid-template-columns:repeat(4,1fr);gap:14px}}
.stat-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff,#f8fbff);border:1px solid #e1e9f5;border-radius:12px;padding:11px 13px}
.stat-card::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,#ef6a62,#ffb38a)}
.stat-card.clickable{cursor:pointer}
.stat-card.highlight{background:linear-gradient(145deg,#eaf1ff,#d6e4fc);border-color:#bdd2f5}
.stat-card.highlight::before{background:linear-gradient(90deg,#2864dc,#6ba8ff)}
.stat-label{font-size:10.5px;font-weight:700;color:#718096;margin-bottom:4px}
.stat-value{font-size:19px;font-weight:800;color:var(--ink)}
.stat-value.pos{color:#078461}
.stat-value.neg{color:#d1474b}
.stat-value.blue{color:#2864dc}
.stat-sub{font-size:10.5px;color:#7a899e;margin-top:3px;font-weight:600}
.sec-title{font-size:14px;font-weight:800;color:#20375c;margin:18px 3px 9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-title .tag{font-size:10.5px;font-weight:700;background:#edf3fc;color:#59708e;border:1px solid #dce7f5;padding:3px 8px;border-radius:999px}
.dash-cols{display:block}
@media(min-width:900px){.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 5px;border-bottom:1px solid #edf1f6;gap:10px}
.li:last-child{border-bottom:none}
.li:hover{background:#f7faff}
.li-main{min-width:0;flex:1}
.li-title{font-size:14px;font-weight:700;color:#26364d;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11.5px;color:#7a899e;margin-top:3px;line-height:1.45}
.li-amt{font-size:14px;font-weight:800;white-space:nowrap}
.li-amt.pos{color:var(--green)}
.li-amt.neg{color:var(--red)}
.li-act{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.ibtn{width:30px;height:30px;border-radius:9px;border:1px solid #e0e8f2;background:#f8faff;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--soft);cursor:pointer;user-select:none}
.ibtn:hover{background:#eaf1ff;color:var(--blue);border-color:#bdd2f5}
.ibtn.danger{color:var(--red);background:#fff6f5;border-color:#f7d6d2}
.ibtn.danger:hover{background:#ffe6e4}
.empty{text-align:center;padding:36px 12px;color:#7b899b;font-size:13px;line-height:1.7}
.loading{text-align:center;padding:60px 10px;color:var(--soft);font-size:13px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#3978ed,#1d50b9);color:#fff;border:3px solid #fff;font-size:26px;box-shadow:0 10px 22px rgba(31,83,190,.38);display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer}
@media(min-width:900px){.fab{right:calc((100vw - 1180px)/2 + 24px)}}
@media(min-width:900px) and (max-width:1228px){.fab{right:24px}}
.btn{flex:1;padding:12px 16px;border-radius:11px;border:none;font-size:14.5px;font-weight:700;font-family:'Noto Sans Bengali';cursor:pointer}
.btn.primary{background:linear-gradient(135deg,#3572e6,#2053ba);color:#fff;box-shadow:0 5px 12px rgba(32,83,186,.22)}
.btn.ghost{background:#eef3fa;color:#31445f}
.btn:disabled{opacity:.7;cursor:not-allowed}
.acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.acts .btn{min-width:130px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--soft);margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border-radius:11px;border:1.4px solid #dce5f1;font-family:'Noto Sans Bengali','Inter';font-size:14.5px;background:#f9fbfe;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#4c83ea;background:#fff;box-shadow:0 0 0 3px rgba(54,111,224,.12)}
.field input[readonly]{background:var(--gray2);color:var(--soft);cursor:not-allowed}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow .field{flex:1;min-width:120px}
.modal-back{position:fixed;inset:0;background:rgba(12,27,53,.58);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-back.open{display:flex}
.modal{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
@media(min-width:900px){.modal-back{align-items:center;padding:24px}.modal{max-width:640px;border-radius:18px;padding:24px 26px;max-height:86vh}}
.modal h3{margin:0 0 14px;font-size:17px;color:var(--navy)}
.report-table{width:100%;border-collapse:collapse;font-size:12.5px}
.report-table th,.report-table td{padding:7px 8px;text-align:left;border-bottom:1px solid #e8edf4}
.report-table th{background:#f4f7fc;color:#526681;font-size:11px;font-weight:700}
.report-table td.num,.report-table th.num{text-align:right}
.report-table tfoot td{font-weight:700;border-top:1.5px solid var(--navy)}
.report-table td.ledger-actions,.report-table th.ledger-actions{white-space:nowrap;width:1%;text-align:right}
.report-table td.ledger-actions .ibtn{display:inline-flex;width:26px;height:26px;font-size:12px;margin-left:2px}
.preview-scroll{-webkit-overflow-scrolling:touch;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.book-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.book-table{width:100%;border-collapse:collapse;min-width:820px;font-size:12px}
.book-table th{position:sticky;top:0;background:var(--navy);color:#fff;padding:9px 7px;text-align:left;font-size:11px;z-index:1}
.book-table td{padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:top}
.book-table .num{text-align:right}
.book-table .book-actions{white-space:nowrap;width:1%;text-align:right}
.book-table .book-actions .ibtn{display:inline-flex;width:26px;height:26px;font-size:12px;margin-left:2px}
.book-in{color:var(--green);font-weight:700}
.book-out{color:var(--red);font-weight:700}
.book-open{background:#fff8e6}
.book-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.book-kpi{background:linear-gradient(135deg,#fff,#f7f5ef);border:1px solid var(--line);border-radius:12px;padding:12px}
.book-kpi .klabel{font-size:10.5px;color:var(--soft);margin-bottom:3px}
.book-kpi .kvalue{font:700 18px Inter;color:var(--navy)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:30px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
#authScreen{position:fixed;inset:0;z-index:100;background:linear-gradient(155deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;padding:20px}
#authScreen.hidden{display:none}
.auth-box{background:#fff;border-radius:18px;padding:30px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-logo{width:52px;height:52px;border-radius:13px;margin:0 auto 14px;background:repeating-linear-gradient(0deg,var(--blue) 0 6px,var(--blue2) 6px 7px)}
.auth-error{background:#FBEDE7;border:1px solid #EFC9B7;color:var(--red);padding:8px 11px;border-radius:9px;font-size:12.5px;margin-bottom:12px;display:none}
.auth-error.show{display:block}
.drawer-back{position:fixed;inset:0;background:rgba(10,25,50,.52);z-index:1200;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.drawer-back.open{opacity:1;visibility:visible}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(88vw,360px);background:#fff;box-shadow:12px 0 32px rgba(9,29,61,.25);transform:translateX(-100%);transition:transform .23s;display:flex;flex-direction:column;overflow:auto}
.drawer-back.open .drawer{transform:translateX(0)}
.drawer-head{padding:20px 18px 15px;background:linear-gradient(135deg,#112343,#1c4c91);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer-head strong{font-size:17px}
.drawer-head small{font-size:10.5px;opacity:.75;display:block;margin-top:2px}
.drawer-close{width:38px;height:38px;border:0;background:rgba(255,255,255,.13);color:#fff;border-radius:10px;font-size:24px;cursor:pointer}
.drawer-sec{padding:12px 12px 5px;font-size:10px;font-weight:800;color:#8a99ad;letter-spacing:.3px;text-transform:uppercase}
.drawer-list{padding:0 10px 10px}
.ditem{width:100%;display:flex;align-items:center;gap:12px;border:0;background:#fff;color:#243b60;border-radius:12px;padding:12px 13px;margin:3px 0;font-size:13px;font-weight:700;text-align:left;cursor:pointer}
.ditem:hover{background:#f1f6fd}
.ditem .di{width:28px;text-align:center;font-size:19px}
.ditem.danger{color:var(--red);background:#fff7f6}
.ditem.install{background:linear-gradient(135deg,#e7f8ee,#d4f0e0);color:#0d7a4d;border:1px solid #b7e5cc}
.lang-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px 10px 14px}
.lang-btn{border:1px solid #dbe5f2;background:#f8fbff;border-radius:11px;padding:10px;font-weight:800;color:#4c607c;cursor:pointer;font-size:13px}
.lang-btn.active{background:#eaf1ff;color:var(--blue);border-color:#bdd2f5}
.catchip{display:inline-block;font-size:10.5px;background:var(--gray2);color:var(--soft);padding:2px 8px;border-radius:20px}
.catchip.open{background:#fff8e6;color:#8a6b12;border:1px solid #f0c869}
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.share-card{background:#f4f7fb;border:1px solid #d9e2ef;border-radius:10px;padding:10px 12px}
.share-card .small{font-size:11.5px;color:#64748b;margin-bottom:4px}
.share-card .value{font-size:17px;font-weight:800;color:var(--navy)}
.openfield{background:#fff8e6;border:1px dashed #f0c869;border-radius:11px;padding:10px 12px;margin-top:4px}
.openfield label{color:#8a6b12!important}
.openfield .hint{font-size:10.5px;color:#8a6b12;margin-top:5px}
.receipt-format{font-family:'Inter','Noto Sans Bengali',sans-serif;background:#fff;padding:22px 26px;color:#1a1a1a;max-width:820px;margin:0 auto;border:1px solid #cfcfcf}
.receipt-company{text-align:center;font-family:'Baloo Da 2','Noto Sans Bengali';font-size:32px;font-weight:800;color:#12213f;margin-bottom:2px;line-height:1.1}
.receipt-address{text-align:center;font-size:12px;color:#333;line-height:1.55;margin-bottom:10px;font-style:italic}
.receipt-project-line{display:inline-block;background:#12213f;color:#fff;font-weight:800;font-size:17px;padding:9px 42px;border-radius:3px;margin-top:6px;font-style:normal}
.receipt-top-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:18px 0 12px;font-size:13px;gap:8px}
.receipt-no{font-style:italic;font-weight:700;color:#333;font-size:15px}
.receipt-badge{background:linear-gradient(180deg,#c1521c,#973d0f);color:#fff;font-weight:800;font-size:22px;letter-spacing:1.5px;padding:10px 34px;border-radius:6px;box-shadow:0 3px 0 #6f2a07,0 7px 14px rgba(0,0,0,.25);border:2px solid #dd7d47;text-align:center;white-space:nowrap}
.receipt-line{display:flex;align-items:flex-end;font-size:13.5px;margin:12px 0;gap:8px}
.receipt-label{font-style:italic;color:#222;white-space:nowrap;font-weight:600}
.receipt-dotted{flex:1;border-bottom:1px dotted #555;min-height:22px;display:flex;align-items:flex-end;padding:0 6px}
.receipt-value{font-weight:700;color:#111;font-size:14.5px;padding-bottom:2px}
.receipt-taka-box{display:flex;align-items:stretch;margin:18px 0 14px;width:fit-content;border:1.6px solid #222;border-radius:3px;overflow:hidden}
.receipt-taka-label{background:#fff;padding:10px 16px;font-size:14px;font-weight:800;font-style:italic;border-right:1.6px solid #222;display:flex;align-items:center}
.receipt-taka-value{background:#fff;padding:10px 34px;font-size:17px;font-weight:800;color:#111;display:flex;align-items:center}
.receipt-signature{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:42px;padding:0 10px}
.receipt-sig-line{border-top:1.6px solid #222;padding-top:8px;text-align:center;font-size:12.5px;font-weight:700;color:#1a1a1a}
.receipt-computer-msg{text-align:center;font-size:11.5px;font-style:italic;color:#444;margin-top:28px;padding-top:8px;border-top:1px dotted #aaa}
.sv-share-info{margin-top:18px;border-top:1px solid #bbb;padding-top:12px}
.sv-share-title{font-weight:800;font-size:13.5px;color:#12213f;margin-bottom:10px}
.sv-share-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sv-share-grid .cell{border:1px solid #bbb;border-radius:4px;padding:9px 14px;background:#fafbfc;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.sv-share-grid .k{font-size:11.5px;color:#555;font-weight:600}
.sv-share-grid .v{font-size:14.5px;font-weight:800;color:#12213f}
.sv-share-grid .v.pos{color:#0f8a67}
.sv-share-grid .v.neg{color:#c9302c}
.voucher-box{background:#fff;padding:16px;color:#111}
.sv-company{text-align:center;border-bottom:1.5px solid #12213f;padding-bottom:8px;margin-bottom:10px}
.sv-company-name{font-size:22px;font-weight:800;color:#12213f}
.sv-company-addr{font-size:11.5px;color:#444;font-style:italic}
.sv-badge-wrap{text-align:center;margin:10px 0}
.sv-badge{display:inline-block;background:#12213f;color:#fff;font-weight:800;font-size:16px;letter-spacing:1.5px;padding:7px 32px;border-radius:4px}
.sv-project-row{display:flex;font-size:13px;margin:10px 0;padding:7px 10px;background:#f1f5fb;border-radius:6px}
.sv-project-row .lbl{font-weight:700;color:#333;min-width:80px}

<script>
/* ═══════════════════════════════════════════════
   CORE UTILITIES
   ═══════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isoDate=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const today=()=>isoDate(new Date());
const bnDig='০১২৩৪৫৬৭৮৯';
const toBn=v=>String(v).replace(/\d/g,d=>bnDig[d]);
let LANG='en';
function setLang(l){LANG=l==='bn'?'bn':'en';try{localStorage.setItem('at_lang',LANG);}catch(e){}}
function loadLang(){try{LANG=localStorage.getItem('at_lang')||'en';}catch(e){LANG='en';}}
function L(en,bn){return LANG==='bn'?bn:en;}
function num(v,dec=0){const n=Number(v);if(!Number.isFinite(n))return String(v??'');const s=n.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});return LANG==='bn'?toBn(s):s;}
function money(n){return '৳'+num(Math.round(Number(n)||0),0);}
function fmtDate(d){if(!d)return '—';const p=String(d).split('-');if(p.length===3){const out=parseInt(p[2],10)+'/'+parseInt(p[1],10)+'/'+p[0].slice(2);return LANG==='bn'?toBn(out):out;}return d;}
function parseDate(v){const raw=String(v??'').trim();if(!raw)return '';const now=new Date();let d,m,y,mm;
  if((mm=raw.match(/^(\d{1,2})$/))){d=+mm[1];m=now.getMonth()+1;y=now.getFullYear();}
  else if((mm=raw.match(/^(\d{1,2})[\/\-.](\d{1,2})$/))){d=+mm[1];m=+mm[2];y=now.getFullYear();}
  else if((mm=raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/))){d=+mm[1];m=+mm[2];y=+mm[3];if(y<100)y+=2000;}
  else if((mm=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))){y=+mm[1];m=+mm[2];d=+mm[3];}
  else return '';

async function loadState(){
  const [sh,dp,ex,ct,sp,spp,ln,lnp,jr]=await Promise.all([loadKey('shareholders',()=>[]),loadKey('deposits',()=>[]),loadKey('expenses',()=>[]),loadKey('categories',seedCats),loadKey('suppliers',()=>[]),loadKey('supplierPayments',()=>[]),loadKey('loans',()=>[]),loadKey('loanPayments',()=>[]),loadKey('journal',()=>[])]);
  STATE={shareholders:sh,deposits:dp,expenses:ex,categories:ct,suppliers:sp,supplierPayments:spp,loans:ln,loanPayments:lnp,journal:jr};
  STATE.categories.forEach(c=>{
    if(!c.nameBn) c.nameBn = c.name || c.nameEn || '';
    if(!c.nameEn) c.nameEn = c.name || c.nameBn || '';
    if(!c.name)   c.name   = c.nameBn || c.nameEn || '';
    if(!c.expenseType) c.expenseType = c.unit ? 'purchase' : 'general';
  });
  const lookup = new Set();
  STATE.categories.forEach(c=>{
    if(c.name)   lookup.add(String(c.name).trim().toLowerCase());
    if(c.nameBn) lookup.add(String(c.nameBn).trim().toLowerCase());
    if(c.nameEn) lookup.add(String(c.nameEn).trim().toLowerCase());
  });
  const orphanMap = new Map();
  STATE.expenses.forEach(e=>{
    const n = String(e.category||'').trim();
    if(!n) return;
    const key = n.toLowerCase();
    if(!lookup.has(key)) orphanMap.set(n, true);
  });
  if(orphanMap.size){
    orphanMap.forEach((_, n)=>{
      const sample = STATE.expenses.find(e => String(e.category||'').trim() === n);
      const hasQty = sample && (Number(sample.qty) > 0);
      const unit = (sample && sample.unit) ? sample.unit : '';
      const type = (sample && sample.expenseType) || (hasQty || unit ? 'purchase' : 'general');
      STATE.categories.push({id: uid(), name: n, nameBn: n, nameEn: n, unit: unit, expenseType: type, openingAmount: 0, openingQty: 0});
      lookup.add(n.toLowerCase());
    });
    saveKey('categories', STATE.categories).catch(()=>{});
  }
  let expensesChanged = false, categoriesChanged = false;
  STATE.expenses.forEach(e=>{
    const hasQty = Number(e.qty) > 0;
    const hasUnit = String(e.unit||'').trim().length > 0;
    if(!hasQty && !hasUnit) return;
    const c = STATE.categories.find(x=>x.name===e.category || x.nameBn===e.category || x.nameEn===e.category);
    if(c && c.expenseType !== 'purchase'){ c.expenseType = 'purchase'; if(!c.unit && e.unit) c.unit = e.unit; categoriesChanged = true; }
    if(e.expenseType !== 'purchase'){ e.expenseType = 'purchase'; expensesChanged = true; }
    if(!e.payType || e.payType === 'general'){ e.payType = 'cash_purchase'; expensesChanged = true; }
  });
  if(categoriesChanged) saveKey('categories', STATE.categories).catch(()=>{});
  if(expensesChanged) saveKey('expenses', STATE.expenses).catch(()=>{});
}

/* MODAL STACK */
let MODAL_STACK=[];let _currentModalWire=null;
function openModal(){$('modalBack').classList.add('open');}
function saveModalState(){
  if(!$('modalBack').classList.contains('open'))return null;
  const body=$('modalBody');if(!body.children.length)return null;
  const fields=[];
  body.querySelectorAll('input, select, textarea').forEach(el=>{
    if(el.type==='checkbox'||el.type==='radio')fields.push({checked:el.checked,value:el.value});
    else fields.push({value:el.value});
  });
  return {html:body.innerHTML,fields,scrollTop:body.scrollTop,wire:_currentModalWire};
}
function restoreModalState(state){
  const body=$('modalBody');body.innerHTML=state.html;
  const els=body.querySelectorAll('input, select, textarea');
  state.fields.forEach((f,i)=>{if(!els[i])return;if('checked' in f)els[i].checked=f.checked;if('value' in f)els[i].value=f.value;});
  body.scrollTop=state.scrollTop||0;_currentModalWire=state.wire;
  if(state.wire){try{state.wire();}catch(e){console.error('wire restore failed',e);}}
}
function pushModalSnapshot(){const snap=saveModalState();if(snap)MODAL_STACK.push(snap);}
function closeModal(){const state=MODAL_STACK.pop();if(state){restoreModalState(state);return;}_currentModalWire=null;$('modalBack').classList.remove('open');$('modalBody').innerHTML='';}
function closeAllModals(){MODAL_STACK=[];_currentModalWire=null;$('modalBack').classList.remove('open');$('modalBody').innerHTML='';}

function wireRowBtns(){
  document.querySelectorAll('.del-btn').forEach(b=>{
    b.onclick=async ev=>{
      ev.stopPropagation();
      const btn=ev.target.closest('.del-btn');const li=btn?btn.closest('.li'):null;
      const type=btn?.dataset?.type||li?.dataset?.type;const id=btn?.dataset?.id||li?.dataset?.id;
      if(!type||!id)return;
      if(!confirm(L('Delete this entry?','এই এন্ট্রি মুছবেন?')))return;
      if(type==='journal'){await deleteJournal(id);return;}
      if(type==='suppliers'){
        const payCount=STATE.supplierPayments.filter(p=>p.supplierId===id).length;
        const invCount=STATE.expenses.filter(e=>e.supplierId===id).length;
        if((payCount||invCount)&&!confirm(L('This supplier has transactions. Delete anyway?','লেনদেন আছে। তবুও মুছবেন?')))return;
      }
      if(type==='shareholders'){
        const sh=STATE.shareholders.find(x=>x.id===id);
        const depCount=sh?STATE.deposits.filter(d=>d.name===sh.name).length:0;
        const xferCount=STATE.journal.filter(j=>(j.type==='transfer'||j.isShareTransfer)&&(j.fromId===id||j.toId===id)).length;
        if((depCount||xferCount)&&!confirm(L('This shareholder has transactions. Delete anyway?','লেনদেন আছে। তবুও মুছবেন?')))return;
      }
      if(type==='loans'){
        const payCount=STATE.loanPayments.filter(p=>p.loanId===id).length;
        if(payCount&&!confirm(L('This loan has payments. Delete loan and all payments?','ঋণ ও সব পরিশোধ মুছবেন?')))return;
        if(payCount){STATE.loanPayments=STATE.loanPayments.filter(p=>p.loanId!==id);await saveKey('loanPayments',STATE.loanPayments);}
      }
      STATE[type]=STATE[type].filter(x=>x.id!==id);await saveKey(type,STATE[type]);
      toast(L('Deleted','মুছে ফেলা হয়েছে'));render();
    };
  });
  document.querySelectorAll('.edit-btn').forEach(b=>{
    b.onclick=ev=>{
      ev.stopPropagation();
      const btn=ev.target.closest('.edit-btn');const li=btn?btn.closest('.li'):null;
      const type=btn?.dataset?.type||li?.dataset?.type;const id=btn?.dataset?.id||li?.dataset?.id;
      if(!type||!id)return;
      if(type==='supplierPayments'){editSupplierPayment(id);return;}
      if(type==='loanPayments'){editLoanPayment(id);return;}
      if(type==='journal'){editJournal(id);return;}
      openForm(type,id);
    };
  });
  document.querySelectorAll('.pay-btn').forEach(b=>{
    b.onclick=ev=>{ev.stopPropagation();const el=ev.target.closest('.pay-btn');openPaymentForm(el.dataset.kind,el.dataset.id);};
  });
}
window.wireRowBtns=wireRowBtns;

function viewDaybook(){

    <div class="card"><div class="frow"><div class="field"><label>${L('From','শুরু')}</label><input type="text" inputmode="numeric" value="${esc(DB_FILTERS.dayFrom ? fmtDate(DB_FILTERS.dayFrom) : '')}" onchange="DB_FILTERS.dayFrom=parseDate(this.value)||'';render()"></div><div class="field"><label>${L('To','শেষ')}</label><input type="text" inputmode="numeric" value="${esc(DB_FILTERS.dayTo ? fmtDate(DB_FILTERS.dayTo) : fmtDate(today()))}" onchange="DB_FILTERS.dayTo=parseDate(this.value)||'';render()"></div></div></div>

function viewBook(acc){
  const isBank=acc==='bank';const k=isBank?'bankStart':'cashStart',k2=isBank?'bankEnd':'cashEnd';
  if(!DB_FILTERS[k])DB_FILTERS[k]=today();if(!DB_FILTERS[k2])DB_FILTERS[k2]=today();
  const tx=[];
  const push=(date,voucher,desc,ledger,amt,isIn,kind,refId)=>{
    if(!date||date<DB_FILTERS[k]||date>DB_FILTERS[k2])return;
    tx.push({date,voucher,desc,ledger,amount:Number(amt)||0,in:!!isIn,kind,refId});
  };
  STATE.deposits.forEach(d=>{if(depAcc(d)===acc)push(d.date,d.receipt,dNameByStored(d.name||''),dNameByStored(d.name||''),d.amount,true,'deposit',d.id);});
  STATE.expenses.forEach(e=>{if(expAcc(e)===acc){const paid=e.paymentType==='credit'?Number(e.paidNow)||0:Number(e.total)||0;if(paid)push(e.date,e.voucher,e.notes||e.category||'',e.category||'',paid,false,'expense',e.id);}});
  STATE.supplierPayments.forEach(p=>{if((p.paymentAccount||'cash')===acc){const s=STATE.suppliers.find(x=>x.id===p.supplierId);push(p.date,p.voucher||'',p.notes||'Payment',s?supName(s):'',p.amount,false,'supplierPayment',p.id);}});
  STATE.loans.forEach(l=>{if((l.account||'cash')===acc)push(l.date,'',l.type==='payable'?'Loan received':'Loan given',loanPersonName(l),l.principal,l.type==='payable','loan',l.id);});
  STATE.loanPayments.forEach(p=>{if((p.paymentAccount||'cash')!==acc)return;const l=STATE.loans.find(x=>x.id===p.loanId);if(l)push(p.date,p.voucher||'',l.type==='payable'?'Loan paid':'Loan received',loanPersonName(l),p.amount,l.type==='receivable','loanPayment',p.id);});
  STATE.journal.forEach(j=>{
    if(j.fromType===acc)push(j.date,j.voucher,partyLabel(j.fromType,j.fromId)+' → '+partyLabel(j.toType,j.toId),partyLabel(j.toType,j.toId),j.amount,false,'journal',j.id);
    if(j.toType===acc)push(j.date,j.voucher,partyLabel(j.fromType,j.fromId)+' → '+partyLabel(j.toType,j.toId),partyLabel(j.fromType,j.fromId),j.amount,true,'journal',j.id);
  });
  tx.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.voucher||'').localeCompare(b.voucher||''));
  const openBal=isBank?openingBank():openingCash();let run=openBal,tIn=0,tOut=0;
  const rows=tx.map(t=>{
    run+=t.in?t.amount:-t.amount;if(t.in)tIn+=t.amount;else tOut+=t.amount;
    const actionCell=`<td class="book-actions">
      <div class="ibtn" title="View" onclick="bookView('${t.kind}','${t.refId}')">👁</div>
      <div class="ibtn" title="Edit" onclick="bookEdit('${t.kind}','${t.refId}')">✎</div>
      <div class="ibtn" title="Print" onclick="bookPrint('${t.kind}','${t.refId}')">🖨️</div>
      <div class="ibtn danger" title="Delete" onclick="bookDelete('${t.kind}','${t.refId}')">🗑</div>
    </td>`;
    return `<tr><td>${fmtDate(t.date)}</td><td>${esc(t.voucher||'—')}</td><td>${esc(t.desc)}</td><td>${esc(t.ledger)}</td><td class="num book-in">${t.in?money(t.amount):'—'}</td><td class="num book-out">${!t.in?money(t.amount):'—'}</td><td class="num">${money(run)}</td>${actionCell}</tr>`;
  }).join('');
  const openingRow=(openBal!==0)?`<tr class="book-open"><td colspan="4"><b>💰 ${L('Opening Balance','পূর্বের ব্যালেন্স')}</b></td><td class="num">${openBal>0?money(openBal):'—'}</td><td class="num">${openBal<0?money(Math.abs(openBal)):'—'}</td><td class="num"><b>${money(openBal)}</b></td><td></td></tr>`:'';
  const header=`<tr><th>${L('Date','তারিখ')}</th><th>${L('Voucher','ভাউচার')}</th><th>${L('Description','বিবরণ')}</th><th>${L('Ledger','লেজার')}</th><th class="num">${L('In','জমা')}</th><th class="num">${L('Out','প্রদান')}</th><th class="num">${L('Balance','ব্যালেন্স')}</th><th class="book-actions">${L('Action','অ্যাকশন')}</th></tr>`;
  return `<div class="card"><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn ${!isBank?'primary':'ghost'}" onclick="switchTab('cashbook')">📘 ${L('Cash','নগদ')}</button><button class="btn ${isBank?'primary':'ghost'}" onclick="switchTab('bankbook')">🏦 ${L('Bank','ব্যাংক')}</button></div>
      <div class="frow"><div class="field"><label>${L('From','শুরু')}</label><input type="text" inputmode="numeric" value="${esc(fmtDate(DB_FILTERS[k]))}" onchange="DB_FILTERS['${k}']=parseDate(this.value)||today();render()"></div><div class="field"><label>${L('To','শেষ')}</label><input type="text" inputmode="numeric" value="${esc(fmtDate(DB_FILTERS[k2]))}" onchange="DB_FILTERS['${k2}']=parseDate(this.value)||today();render()"></div></div>
      <div class="book-kpis"><div class="book-kpi"><div class="klabel">${L('Opening','পূর্বের')}</div><div class="kvalue">${money(openBal)}</div></div><div class="book-kpi"><div class="klabel">${L('Total In','মোট জমা')}</div><div class="kvalue book-in">${money(tIn)}</div></div><div class="book-kpi"><div class="klabel">${L('Total Out','মোট প্রদান')}</div><div class="kvalue book-out">${money(tOut)}</div></div></div>
      <div class="book-table-wrap"><table class="book-table"><thead>${header}</thead><tbody>${openingRow}${rows||`<tr><td colspan="8" style="text-align:center;padding:35px">${L('No transactions','লেনদেন নেই')}</td></tr>`}</tbody></table></div></div>`;
}

function calcPurchaseField(row, source){
  if(!row)return;
  const qEl=row.querySelector('.exp-qty'),rEl=row.querySelector('.exp-rate'),tEl=row.querySelector('.exp-tot');
  if(!qEl||!rEl||!tEl)return;
  const q=Number(qEl.value)||0,r=Number(rEl.value)||0,t=Number(tEl.value)||0;
  if(source==='qty' || source==='rate'){
    if(q>0 && r>0){const tot=q*r;tEl.value=Number.isInteger(tot)?tot:String(Number(tot.toFixed(2)));}
  } else if(source==='total'){
    if(q>0 && t>0){const rate=t/q;rEl.value=Number.isInteger(rate)?rate:String(Number(rate.toFixed(4)));}
  }
}
window.calcPurchaseField=calcPurchaseField;
function calcPurchaseTotal(row){calcPurchaseField(row,'qty');}
window.calcPurchaseTotal=calcPurchaseTotal;

  if(gen){gen.style.display=isP?'none':'';gen.querySelectorAll('input').forEach(el=>{el.disabled=isP;});}
  if(pur){pur.style.display=isP?'':'none';pur.querySelectorAll('input').forEach(el=>{el.disabled=!isP;});}
  if(gt)gt.style.display=isP?'none':'';
  const gtIn=row.querySelector('.exp-gtotal');if(gtIn){gtIn.required=!isP;gtIn.disabled=isP;}
  const u=row.querySelector('.exp-unit');if(u){const c=STATE.categories.find(x=>x.name===row.querySelector('.exp-cat')?.value);u.value=c?.unit||'';}
  const isC=isP&&row.querySelector('.exp-ptype')?.value==='credit';
  const cred=row.querySelector('.exp-cred');if(cred){cred.style.display=isC?'':'none';cred.querySelectorAll('input,select').forEach(el=>{el.disabled=!isC;});}}

function syncPayType(form){if(!form)return;const pt=form.querySelector('[name="payType"]')?.value||'general';const simpleTypes=['supplier_payment','loan_repayment','shareholder_refund'];const isSimple=simpleTypes.includes(pt);
  const ptE=form.querySelector('.pt-expense'),ptS=form.querySelector('.pt-simple');
  if(ptE){ptE.style.display=isSimple?'none':'';ptE.querySelectorAll('input,select,textarea').forEach(el=>{el.disabled=isSimple;});}
  if(ptS){ptS.style.display=isSimple?'':'none';ptS.querySelectorAll('input,select,textarea').forEach(el=>{el.disabled=!isSimple;});}
  ['supplier','loan','sh'].forEach(k=>{const el=form.querySelector('.pt-'+k);if(!el)return;const show=isSimple&&(pt===(k==='supplier'?'supplier_payment':k==='loan'?'loan_repayment':'shareholder_refund'));el.style.display=show?'':'none';el.querySelectorAll('input,select,textarea').forEach(x=>{x.disabled=!show;});});
  const ab=form.querySelector('[name="approvedBy"]');if(ab)ab.required=!isSimple;
  form.querySelectorAll('.exp-row').forEach(row=>{const cat=row.querySelector('.exp-cat');if(!cat)return;const allowedTypes=pt==='general'?['general']:pt==='cash_purchase'||pt==='credit_purchase'?['purchase']:['general','purchase'];
    Array.from(cat.options).forEach(opt=>{if(!opt.value)return;const c=STATE.categories.find(x=>x.name===opt.value);const t=c?(c.expenseType||'general'):'general';if(!allowedTypes.includes(t)){opt.style.display='none';opt.disabled=true;if(cat.value===opt.value)cat.value='';}else{opt.style.display='';opt.disabled=false;}});
    const ptype=row.querySelector('.exp-ptype');if(ptype){if(pt==='cash_purchase')ptype.value='cash';else if(pt==='credit_purchase')ptype.value='credit';ptype.disabled=(pt!=='general');const pw=ptype.closest('.field');if(pw)pw.style.display=(pt==='general')?'':'none';}syncExpRow(row);});}
window.syncPayType=syncPayType;
function addExpRow(){const box=$('expList');if(!box)return;const i=box.querySelectorAll('.exp-row').length;box.insertAdjacentHTML('beforeend',expRowHtml(null,i));box.querySelectorAll('.exp-row').forEach((r,idx)=>{r.querySelector('.row-n').textContent=idx+1;});const form=$('ef');if(form)syncPayType(form);}
window.addExpRow=addExpRow;

function wireFormSubmit(type,id){
  const form=$('ef');
  form.onsubmit = (ev) => {
    ev.preventDefault();
    safeSubmit(form, async () => {
      try{
        if(type==='expenses'){
          const payType=form.querySelector('[name="payType"]')?.value||'general';
          const simpleTypes=['supplier_payment','loan_repayment','shareholder_refund'];
          const date=parseDate(form.querySelector('[name="date"]').value)||today();
          const voucher=form.querySelector('[name="voucher"]').value.trim();

          if(simpleTypes.includes(payType)){
            const amount=Math.round(Number(form.querySelector('[name="simpleAmount"]').value)||0);
            const account=form.querySelector('[name="simpleAccount"]').value;
            const notes=form.querySelector('[name="simpleNotes"]').value.trim();
            if(!amount){toast(L('Enter amount','পরিমাণ'));return;}
            if(payType==='supplier_payment'){
              const sid=form.querySelector('[name="spSupplierId"]').value;
              if(!sid){toast(L('Select supplier','বাছুন'));return;}
              STATE.supplierPayments.push({id:uid(),supplierId:sid,date,voucher:voucher||nextNo('CPV',STATE.supplierPayments,'voucher'),amount,paymentAccount:account,notes});
              saveKey('supplierPayments',STATE.supplierPayments);
            } else if(payType==='loan_repayment'){
              const lid=form.querySelector('[name="lrLoanId"]').value;
              if(!lid){toast(L('Select loan','বাছুন'));return;}
              STATE.loanPayments.push({id:uid(),loanId:lid,date,voucher:voucher||nextNo('LPV',STATE.loanPayments,'voucher'),amount,paymentAccount:account,notes});
              saveKey('loanPayments',STATE.loanPayments);
            } else {
              const shid=form.querySelector('[name="srShId"]').value;
              if(!shid){toast(L('Select shareholder','বাছুন'));return;}
              STATE.journal.push({id:uid(),date,voucher:voucher||nextNo('JV',STATE.journal,'voucher'),fromType:account,fromId:account,toType:'shareholder',toId:shid,amount,notes:notes||'Refund',type:'refund'});
              saveKey('journal',STATE.journal);
            }
            toast(L('Saved','সংরক্ষিত'));
            closeAllModals();render();return;
          }

          const approvedBy=form.querySelector('[name="approvedBy"]').value.trim();
          const narration=form.querySelector('[name="narration"]')?.value.trim()||'';
          if(!approvedBy){toast(L('Enter approver','অনুমোদনকারী'));return;}
          const forcePay=payType==='cash_purchase'?'cash':payType==='credit_purchase'?'credit':'';
          const rows=[...form.querySelectorAll('.exp-row')];
          const entries=[];
          for(const [i,row] of rows.entries()){
            const cat=row.querySelector('.exp-cat').value;
            if(!cat){toast(L('Select category','বাছুন')+' #'+(i+1));return;}
            const ct=STATE.categories.find(c=>c.name===cat);
            const isP=ct?.expenseType==='purchase';
            const ptype=row.querySelector('.exp-ptype').value;
            let qty=Number(row.querySelector('.exp-qty')?.value||0),rate=Number(row.querySelector('.exp-rate')?.value||0),total=Number(row.querySelector('.exp-tot')?.value||0);
            if(isP){
              if(qty>0 && rate>0 && !total) total=Number((qty*rate).toFixed(2));
              else if(qty>0 && total>0 && !rate) rate=Number((total/qty).toFixed(4));
              if(!total){toast(L('Enter Total or Rate','মোট বা দর দিন')+' #'+(i+1));return;}
            } else {
              qty='';rate='';total=Number(row.querySelector('.exp-gtotal')?.value||0);
              if(!total){toast(L('Enter total','মোট')+' #'+(i+1));return;}
              const paidTo=row.querySelector('.exp-paid').value.trim();
              const purpose=row.querySelector('.exp-purp').value.trim();
              if(!paidTo||!purpose){toast(L('Fill Paid/Purpose','কাকে/কি')+' #'+(i+1));return;}
            }
            const finalPay=forcePay||(isP?ptype:(ptype==='bank'?'bank':'cash'));
            entries.push({category:cat,expenseType:isP?'purchase':'general',qty,unit:isP?(ct?.unit||''):'',rate,total,paidTo:isP?'':row.querySelector('.exp-paid').value.trim(),purpose:isP?'':row.querySelector('.exp-purp').value.trim(),paymentType:finalPay,paymentAccount:isP&&finalPay==='credit'?row.querySelector('.exp-acc').value:(finalPay==='bank'?'bank':'cash'),supplierId:isP&&finalPay==='credit'?row.querySelector('.exp-sup').value:'',paidNow:isP&&finalPay==='credit'?Number(row.querySelector('.exp-pnow').value||0):0,date,voucher,approvedBy,narration,notes:'',payType});
          }

          if(!id && voucher){
            const existing = STATE.expenses.filter(x=>x.voucher===voucher);
            if(existing.length){
              if(!confirm(L('Voucher '+voucher+' already exists. Save anyway?','ভাউচার '+voucher+' আগেই আছে। তবুও সেভ?'))) return;
            }
          }
          if(id){
            const old=STATE.expenses.find(x=>x.id===id);
            if(old) STATE.expenses=STATE.expenses.filter(x=>x.voucher!==old.voucher);
          }
          entries.forEach(e=>STATE.expenses.push({id:uid(),...e}));
          saveKey('expenses',STATE.expenses);
          toast(L('Saved','সংরক্ষিত'));
          closeAllModals();render();return;
        }

        if(type==='deposits'){
          const fd=new FormData(form),data={};fd.forEach((v,k)=>data[k]=v);
          data.date=parseDate(data.date)||today();data.amount=Math.round(Number(data.amount)||0);
          if(!data.amount){toast(L('Enter amount','পরিমাণ'));return;}
          const rt=data.receiptType||'shareholder';
          if(rt==='loan_taken'){
            const personBn=String(data.loanPersonBn||'').trim();
            if(!personBn){toast(L('Enter lender name','ঋণদাতা'));return;}
            const loan={id:uid(),type:'payable',person:personBn,personBn,personEn:String(data.loanPersonEn||'').trim(),phone:data.loanPhone||'',principal:data.amount,date:data.date,account:data.account||'cash',accountNo:nextNo('STL',STATE.loans,'accountNo'),notes:data.notes||'',openingPaid:0};
            STATE.loans.push(loan);saveKey('loans',STATE.loans);
            toast(L('Loan recorded','ঋণ রেকর্ড'));closeAllModals();render();return;
          }
          if(rt==='loan_recovered'){
            if(!data.loanId){toast(L('Select loan','বাছুন'));return;}
            STATE.loanPayments.push({id:uid(),loanId:data.loanId,date:data.date,amount:data.amount,paymentAccount:data.account||'cash',voucher:data.receipt||'',notes:data.notes||''});
            saveKey('loanPayments',STATE.loanPayments);
            toast(L('Loan recovery','ঋণ আদায়'));closeAllModals();render();return;
          }
          if(!data.name){toast(L('Select shareholder','বাছুন'));return;}
          data.receiptType='shareholder';data.notes=data.notesShareholder||'';delete data.notesShareholder;
          if(!id && data.receipt){
            const exists = STATE.deposits.find(x=>x.receipt===data.receipt);
            if(exists){
              if(!confirm(L('Receipt '+data.receipt+' already exists. Save anyway?','রিসিট '+data.receipt+' আগেই আছে। তবুও সেভ?'))) return;
            }
          }
          if(id){
            const i=STATE.deposits.findIndex(x=>x.id===id);
            if(i>=0)STATE.deposits[i]={...STATE.deposits[i],...data};
          } else {
            STATE.deposits.push({id:uid(),...data});
          }
          saveKey('deposits',STATE.deposits);
          toast(L('Saved','সংরক্ষিত'));closeAllModals();render();return;
        }

        const fd=new FormData(form),data={};fd.forEach((v,k)=>data[k]=v);
        if(data.date){const n=parseDate(data.date);if(!n){toast(L('Invalid date','তারিখ'));return;}data.date=n;}
        ['amount','qty','rate','total','shares','principal','openingDeposit','openingDue','openingPaid'].forEach(k=>{if(k in data)data[k]=data[k]===''?0:Number(data[k])||0;});
        if(type==='shareholders'){if(!data.nameBn||!data.nameEn){toast(L('Enter both names','দুই নাম'));return;}data.name=data.nameBn;}
        if(type==='suppliers'){if(!data.nameBn){toast(L('Enter Bangla name','বাংলা নাম'));return;}data.name=data.nameBn;data.nameEn=data.nameEn||'';}
        if(type==='loans'){if(!data.personBn&&!data.personEn){toast(L('Enter name','নাম'));return;}data.personBn=data.personBn||data.personEn;data.personEn=data.personEn||'';data.person=data.personBn;}
        if(id){
          const i=STATE[type].findIndex(x=>x.id===id);
          if(i>=0)STATE[type][i]={...STATE[type][i],...data};
        } else {
          STATE[type].push({id:uid(),...data});
        }
        saveKey(type,STATE[type]);
        toast(L('Saved','সংরক্ষিত'));closeAllModals();render();
      }catch(err){
        console.error(err);toast(L('Error','সমস্যা'));
      }
    });
  };
}

    const rawH=(canvas.height*(pw-m*2))/canvas.width;

    else{const imgW=pw;const imgH=(canvas.height*imgW)/canvas.width;let left=imgH,pos=0;pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,pos,imgW,imgH);left-=ph;while(left>0){pos=left-imgH;pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,pos,imgW,imgH);left-=ph;}}
    return pdf.output('blob');}finally{document.body.removeChild(container);}}

function renderImportPreview(type,rows){
  $('impStep').innerHTML=`<div class="card" style="font-size:12px;background:#eef7ff">${num(rows.length)} ${L('rows','সারি')}</div><div class="acts"><button class="btn primary" id="impGo">${L('Import','ইমপোর্ট')}</button></div>`;
  $('impGo').onclick=async()=>{
    let imported=0;const newRecs=[];const newSups=[];const errors=[];
    for(const [idx,row] of rows.entries()){
      try{
        if(type==='purchase'){
          const dt=parseDate(row[0])||today();
          const ct=String(row[1]||'').trim();if(!ct){errors.push('Row '+(idx+2)+': no category');continue;}
          const qty=Number(row[2])||0;
          const unitRaw=String(row[3]||'').trim();
          const rate=Number(row[4])||0;
          const totalRaw=Number(row[5])||0;
          const payTypeStr=String(row[6]||'cash').toLowerCase().trim();
          const supplierName=String(row[7]||'').trim();
          const paidNow=Number(row[8])||0;
          const account=String(row[9]||'cash').toLowerCase().includes('bank')?'bank':'cash';
          const voucher=String(row[10]||'').trim()||nextNo('EXP',STATE.expenses,'voucher');
          const approvedBy=String(row[11]||'').trim()||L('Imported','ইমপোর্টেড');
          const notes=String(row[12]||'').trim();
          if(!qty){errors.push('Row '+(idx+2)+': no qty');continue;}
          let finalRate=rate, finalTotal=totalRaw;
          if(qty>0 && rate>0 && !totalRaw) finalTotal=Number((qty*rate).toFixed(2));
          else if(qty>0 && totalRaw>0 && !rate) finalRate=Number((totalRaw/qty).toFixed(4));
          if(!finalTotal){errors.push('Row '+(idx+2)+': no total/rate');continue;}
          const lk=ct.toLowerCase().replace(/\s+/g,' ');
          let c=STATE.categories.find(x=>String(x.nameEn||'').toLowerCase().trim().replace(/\s+/g,' ')===lk || String(x.nameBn||'').toLowerCase().trim().replace(/\s+/g,' ')===lk || String(x.name||'').toLowerCase().trim().replace(/\s+/g,' ')===lk);
          if(!c){c={id:uid(),name:ct,nameBn:ct,nameEn:ct,unit:unitRaw||'',expenseType:'purchase',openingAmount:0,openingQty:0};STATE.categories.push(c);}
          else {if(c.expenseType!=='purchase') c.expenseType='purchase';if(unitRaw && !c.unit) c.unit=unitRaw;}
          const isCredit = payTypeStr.includes('credit') || payTypeStr.includes('বাকি');
          let supplierId='';
          if(isCredit && supplierName){
            const slk=supplierName.toLowerCase();
            let sup=STATE.suppliers.find(s=>String(s.nameBn||'').toLowerCase()===slk || String(s.nameEn||'').toLowerCase()===slk || String(s.name||'').toLowerCase()===slk);
            if(!sup){sup={id:uid(),name:supplierName,nameBn:supplierName,nameEn:supplierName,phone:'',notes:'',accountNo:nextNo('SUP',[...STATE.suppliers,...newSups],'accountNo'),openingDue:0};newSups.push(sup);}
            supplierId=sup.id;
          }
          newRecs.push({id:uid(),date:dt,voucher,category:c.name,expenseType:'purchase',qty,unit:unitRaw||c.unit||'',rate:finalRate,total:finalTotal,paidTo:L('Imported','ইমপোর্টেড'),purpose:notes,paymentType: isCredit?'credit':account,paymentAccount: account,supplierId, paidNow: isCredit?paidNow:0,approvedBy,narration:notes,payType: isCredit?'credit_purchase':'cash_purchase',notes:''});
        }
        else if(type==='general'){
          const dt=parseDate(row[0])||today();
          const ct=String(row[1]||'').trim();if(!ct){errors.push('Row '+(idx+2)+': no category');continue;}
          const paidTo=String(row[2]||'').trim()||L('Imported','ইমপোর্টেড');
          const purpose=String(row[3]||'').trim()||ct;
          const amt=Number(row[4])||0;
          const account=String(row[5]||'cash').toLowerCase().includes('bank')?'bank':'cash';
          const voucher=String(row[6]||'').trim()||nextNo('EXP',STATE.expenses,'voucher');
          const approvedBy=String(row[7]||'').trim()||L('Imported','ইমপোর্টেড');
          const notes=String(row[8]||'').trim();
          if(!amt){errors.push('Row '+(idx+2)+': no amount');continue;}
          const lk=ct.toLowerCase().replace(/\s+/g,' ');
          let c=STATE.categories.find(x=>String(x.nameEn||'').toLowerCase().trim().replace(/\s+/g,' ')===lk || String(x.nameBn||'').toLowerCase().trim().replace(/\s+/g,' ')===lk || String(x.name||'').toLowerCase().trim().replace(/\s+/g,' ')===lk);
          if(!c){c={id:uid(),name:ct,nameBn:ct,nameEn:ct,unit:'',expenseType:'general',openingAmount:0,openingQty:0};STATE.categories.push(c);}
          newRecs.push({id:uid(),date:dt,voucher,category:c.name,expenseType:'general',qty:'',unit:'',rate:'',total:amt,paidTo,purpose,paymentType:account,paymentAccount:account,approvedBy,narration:notes,payType:'general',notes:''});
        }
        else if(type==='receipts'){
          const dt=parseDate(row[0])||today();
          const nm=String(row[1]||'').trim();if(!nm){errors.push('Row '+(idx+2)+': no name');continue;}
          const amt=Number(row[2])||0;if(!amt){errors.push('Row '+(idx+2)+': no amount');continue;}
          const receipt=String(row[3]||'').trim()||nextNo('MR',[...STATE.deposits,...newRecs],'receipt');
          const account=String(row[4]||'cash').toLowerCase().includes('bank')?'bank':'cash';
          const notes=String(row[5]||'').trim();
          const p=STATE.shareholders.find(x=>x.name===nm || x.nameBn===nm || x.nameEn===nm || String(x.nameBn||'').toLowerCase()===nm.toLowerCase() || String(x.nameEn||'').toLowerCase()===nm.toLowerCase());
          if(!p){errors.push('Row '+(idx+2)+': shareholder not found: '+nm);continue;}
          newRecs.push({id:uid(),date:dt,name:p.name,receipt,amount:amt,account,notes,receiptType:'shareholder'});
        }
        else if(type==='shareholders'){
          const nBn=String(row[0]||'').trim(),nEn=String(row[1]||'').trim(),ph=String(row[2]||'').trim(),sh=Number(row[3])||0;
          if(!nBn||!nEn||!sh)continue;
          newRecs.push({id:uid(),name:nBn,nameBn:nBn,nameEn:nEn,phone:ph,shares:sh,openingDeposit:0});
        }
        else if(type==='deposits'){
          const dt=parseDate(row[0])||today(),nm=String(row[1]||'').trim(),rc=String(row[2]||'').trim()||nextNo('MR',STATE.deposits,'receipt'),am=Number(row[3])||0,ac=String(row[4]||'').toLowerCase().includes('bank')?'bank':'cash';
          if(!nm||!am)continue;
          newRecs.push({id:uid(),date:dt,name:nm,receipt:rc,amount:am,account:ac,notes:'',receiptType:'shareholder'});
        }
        imported++;
      }catch(e){console.error(e);errors.push('Row '+(idx+2)+': '+e.message);}
    }
    if(!imported){toast(L('No valid rows','কোনো সারি নেই'));return;}
    if(newSups.length){STATE.suppliers=[...STATE.suppliers,...newSups];await saveKey('suppliers',STATE.suppliers);}
    if(type==='purchase' || type==='general'){
      STATE.expenses=[...STATE.expenses,...newRecs];
      await saveKey('expenses',STATE.expenses);
      await saveKey('categories',STATE.categories);
    } else if(type==='receipts' || type==='deposits'){
      STATE.deposits=[...STATE.deposits,...newRecs];
      await saveKey('deposits',STATE.deposits);
    } else if(type==='shareholders'){
      STATE.shareholders=[...STATE.shareholders,...newRecs];
      await saveKey('shareholders',STATE.shareholders);
    }
    closeAllModals();render();
    const msg = `${imported} ${L('imported','ইমপোর্ট')}` + (errors.length?` · ${errors.length} ${L('skipped','বাদ')}`:'');
    toast(msg);
    if(errors.length) console.warn('Import errors:', errors);
  };
}

idbGet = async function(key){
  try{
    if (key === 'projects'){const snap = await fbDB.collection('projects').get();return snap.docs.map(d => ({ id:d.id, ...d.data() }));}
    if (key === 'activeProject') return localStorage.getItem('at_active') || null;
    if (key === 'settings'){const d = await fbDB.collection('app').doc('settings').get();return d.exists ? d.data() : null;}
    if (key === 'dataDirHandle' || key === 'users') return null;
    const m = String(key).match(/^proj_([^_]+)_(.+)$/);
    if (m){const [, pid, field] = m;const d = await fbDB.collection('projects').doc(pid).get();if (!d.exists) return null;const data = d.data();return data[field] !== undefined ? data[field] : null;}
    return null;
  }catch(e){ console.error('idbGet', key, e); return null; }
};
idbSet = async function(key, value){

    if (key === 'settings'){await fbDB.collection('app').doc('settings').set(value || {}, { merge:true });return true;}
    if (key === 'dataDirHandle' || key === 'users') return true;

    if (m){const [, pid, field] = m;if (ROLE === 'viewer') return false;await fbDB.collection('projects').doc(pid).set({ [field]: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },{ merge:true });return true;}

  toast('বদলানো হচ্ছে...');
  try {const user = fbAuth.currentUser;const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);await user.reauthenticateWithCredential(cred);await user.updatePassword(nw);await fbDB.collection('users').doc(user.uid).update({passwordNote: nw});toast('✅ Password সফলভাবে বদলেছে');viewUsers();}
  catch(e){console.error(e);if (e.code === 'auth/wrong-password') toast('বর্তমান password ভুল');else if (e.code === 'auth/weak-password') toast('নতুন password আরও শক্তিশালী দিন');else toast('ব্যর্থ: ' + (e.message || ''));}
}
window.changeAdminPassword = changeAdminPassword;
async function changeViewerPin(uid){
  const doc = await fbDB.collection('users').doc(uid).get();if (!doc.exists){ toast('ইউজার পাওয়া যায়নি'); return; }
  const u = doc.data();const oldPin = u.pin;
  if (!oldPin){if (!confirm('পুরনো PIN সেভ করা নেই।')) return;toast('পুরনো PIN নেই — Firebase Console → Authentication থেকে ম্যানুয়ালি মুছুন');return;}
  const newPin = prompt('নতুন PIN (৪-৮ ডিজিট):', '');
  if (!newPin) return;if (!/^\d{4,8}$/.test(newPin)){ toast('PIN ৪-৮ ডিজিট সংখ্যা হবে'); return; }
  if (newPin === oldPin){ toast('একই PIN — বদলানোর দরকার নেই'); return; }
  toast('বদলানো হচ্ছে...');
  try {const secondary = firebase.initializeApp(firebaseConfig, 'pin-' + Date.now());const secAuth = secondary.auth();const cred = await secAuth.signInWithEmailAndPassword(u.email, oldPin);await cred.user.updatePassword(newPin);await secAuth.signOut();await secondary.delete();await fbDB.collection('users').doc(uid).update({ pin: newPin });toast('✅ PIN বদলেছে');viewUsers();}
  catch(e){console.error(e);if (e.code === 'auth/wrong-password') toast('পুরনো PIN মিলছে না');else toast('ব্যর্থ: ' + (e.message||''));}
}
window.changeViewerPin = changeViewerPin;
async function changeViewerProject(uid){
  const doc = await fbDB.collection('users').doc(uid).get();if (!doc.exists){ toast('ইউজার পাওয়া যায়নি'); return; }
  const u = doc.data();pushModalSnapshot();
  const projOpts = PROJECTS.map(p => `<option value="${esc(p.id)}" ${p.id===u.projectId?'selected':''}>${esc(p.name)}</option>`).join('') || '<option value="">কোনো প্রজেক্ট নেই</option>';
  $('modalBody').innerHTML = `
    <h3>🔄 Viewer-এর প্রজেক্ট বদলান</h3>
    <div style="font-size:12px;background:#fff8e6;border:1px dashed #f0c869;padding:10px 12px;border-radius:9px;margin-bottom:12px;line-height:1.7;color:#8a6b12">⚠️ প্রজেক্ট বদলালে <b>পুরনো লিংক আর কাজ করবে না</b>।</div>
    <form id="cppf" action="javascript:void(0)">
      <div class="field"><label>নতুন প্রজেক্ট</label><select name="pid" required>${projOpts}</select></div>
      <div class="acts"><button type="button" class="btn ghost" onclick="closeModal()">বাতিল</button><button type="submit" class="btn primary">🔄 বদলান</button></div>
    </form>`;
  openModal();
  $('cppf').onsubmit = (ev) => {
    ev.preventDefault();
    safeSubmit(ev.target, async () => {
      const newPid = ev.target.pid.value;
      if (!newPid){ toast('প্রজেক্ট বাছুন'); return; }
      if (newPid === u.projectId){ toast('একই প্রজেক্ট'); closeAllModals(); return; }
      if (!u.pin){ toast('PIN সেভ নেই'); return; }
      toast('বদলানো হচ্ছে...');
      try {const sec1 = firebase.initializeApp(firebaseConfig, 'chg1-' + Date.now());const a1 = sec1.auth();const c1 = await a1.signInWithEmailAndPassword(u.email, u.pin);await c1.user.delete();await a1.signOut();await sec1.delete();
        const hash = await hashId(newPid);const newEmail = 'p-' + hash + VIEWER_DOMAIN;
        const sec2 = firebase.initializeApp(firebaseConfig, 'chg2-' + Date.now());const a2 = sec2.auth();await a2.createUserWithEmailAndPassword(newEmail, u.pin);await a2.signOut();await sec2.delete();
        await fbDB.collection('users').doc(uid).update({ email: newEmail, projectId: newPid });
        closeAllModals();toast('✅ প্রজেক্ট বদলেছে');viewUsers();
      } catch(e){console.error(e);toast('ব্যর্থ: ' + (e.message || ''));}
    });
  };
}
window.changeViewerProject = changeViewerProject;
async function deleteViewerAccount(uid){
  if (!confirm('এই Viewer অ্যাকাউন্টটি মুছে ফেলবেন?')) return;
  const doc = await fbDB.collection('users').doc(uid).get();if (!doc.exists){ toast('ইউজার পাওয়া যায়নি'); return; }
  const u = doc.data();toast('মুছে ফেলা হচ্ছে...');
  if (u.email && u.pin){try {const secondary = firebase.initializeApp(firebaseConfig, 'del-' + Date.now());const secAuth = secondary.auth();const cred = await secAuth.signInWithEmailAndPassword(u.email, u.pin);await cred.user.delete();await secAuth.signOut();await secondary.delete();} catch(e){console.warn('Auth delete skipped:', e.code);}}
  try {await fbDB.collection('users').doc(uid).delete();} catch(e){toast('Firestore ডিলিট ব্যর্থ: ' + (e.message||''));return;}
  toast('✅ Viewer মুছে ফেলা হয়েছে');viewUsers();
}
window.deleteViewerAccount = deleteViewerAccount;
window.delProject = async function(id){
  if (!confirm(L('Delete?','মুছবেন?'))) return;
  try { await fbDB.collection('projects').doc(id).delete(); } catch(e){ console.error(e); }
  PROJECTS = PROJECTS.filter(p => p.id !== id);
  if (ACTIVE === id){ACTIVE = PROJECTS.length ? PROJECTS[0].id : null;if (ACTIVE){ localStorage.setItem('at_active', ACTIVE); await loadState(); }else STATE = blank();}
  closeAllModals(); renderProjBar(); render();
};
window.lockApp = function(){ fbAuth.signOut().catch(()=>{}); };
